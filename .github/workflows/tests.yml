name: Robot Framework Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests (parallel + headless)
        run: python -m pabot.pabot --processes 2 -d results -v BROWSER:headlesschrome -v CHROMEDRIVER: tests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-results
          path: results